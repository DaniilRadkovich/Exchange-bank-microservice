spring:
  application:
    name: exchangeservice

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/exchange}
    username: ${DB_USERNAME:exchange}
    password: ${DB_PASSWORD:exchange}
    hikari:
      pool-name: exchange-pool
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  liquibase:
    change-log: classpath:db/changelog.xml

  jackson:
    default-property-inclusion: non_null
    deserialization:
      # Неизвестное поле в теле — ошибка формата, а не тихо проигнорированное значение. Иначе
      # клиент отправлял бы limit_datetime в POST /limits, думая, что задаёт дату, а сервик её
      # игнорировал, и получал 201 с другой датой.
      fail-on-unknown-properties: true

  mvc:
    problemdetails:
      enabled: true

exchange:
  limit:
    # Лимит по умолчанию, если клиент его не устанавливал (ТЗ п.2).
    # Часового пояса здесь нет: границы месяца определены BudgetPeriod.LIMIT_TIMEZONE (UTC).
    default-sum: 1000.00
    default-currency: USD
  rates:
    # Внешний провайдер дневных курсов; конкретный API выбирается в README.
    # Значение выбирает бин адаптера (@ConditionalOnProperty в RateClientConfig), поэтому
    # незнакомое значение останавливает старт, а не подставляет молча провайдера по умолчанию.
    provider: ${RATES_API_PROVIDER:twelvedata}
    base-url: ${RATES_API_BASE_URL:https://api.twelvedata.com}
    # Ключ приходит только из переменной окружения, значение по умолчанию пустое: секрет в
    # репозитории не лежит, а сервис без ключа не поднимается (@NotBlank в RateProviderProperties).
    api-key: ${RATES_API_KEY:}
    connect-timeout: 2s
    read-timeout: 3s
    # Насколько старым может быть резервный курс, если в БД нет закрытия на дату операции.
    # Курс недельной давности — это уже другой рынок, и молча подставлять его в лимит опаснее,
    # чем вернуть клиенту ошибку расчёта. После истечения срока транзакция уходит в FAILED
    # и ждёт либо операции, либо ручного дорасчёта.
    max-fallback-age: 7d
    # Число повторов при 5xx/таймауте; задержка растёт экспоненциально.
    max-retries: 3
    retry-initial-backoff: 200ms
    retry-max-backoff: 2s
  settlement:
    # Сколько попыток дорасчёта до перевода транзакции из PENDING в FAILED.
    max-attempts: 5
    # Пауза между проходами планировщика. Объявлена один раз: планировщик читает её отсюда же,
    # поэтому второй default в коде разъехался бы с этим значением при первом же изменении.
    retry-delay: 5s
    # Сколько транзакций планировщик берёт за один проход. Пачка целиком уходит в пул расчёта,
    # поэтому размер влияет на число занятых соединений PostgreSQL.
    batch-size: 100
    # Фоновая дорасчётка транзакций. В тестах выключается (см. application-test.yaml),
    # чтобы результат проверки не зависел от фонового потока.
    processing-enabled: true
    # Сколько транзакций дорасчитывается одновременно (ТЗ п.1*). Виртуальные потоки не ограничивают
    # число задач, а каждая задача занимает соединение пула PostgreSQL, поэтому граница обязана быть
    # не больше размера пула.
    parallelism: 16

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Сервис не закрыт Spring Security, поэтому when-authorized не показывал бы детали никогда.
      show-details: always
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.idftech.exchangeservice: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
