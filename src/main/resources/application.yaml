spring:
  application:
    name: exchangeservice

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/exchange}
    username: ${DB_USERNAME:exchange}
    password: ${DB_PASSWORD:exchange}
    hikari:
      pool-name: exchange-pool
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  liquibase:
    change-log: classpath:db/changelog.xml

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

  mvc:
    problemdetails:
      enabled: true

exchange:
  limit:
    default-sum: 1000.00
    default-currency: USD
  rates:
    provider: ${RATES_API_PROVIDER:twelvedata}
    base-url: ${RATES_API_BASE_URL:https://api.twelvedata.com}
    api-key: ${RATES_API_KEY:}
    connect-timeout: 2s
    read-timeout: 3s
    max-fallback-age: 7d
    max-retries: 3
    retry-initial-backoff: 200ms
    retry-max-backoff: 2s
  settlement:
    max-attempts: 5
    retry-delay: 5s
    batch-size: 100
    processing-enabled: true
    parallelism: 16

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.idftech.exchangeservice: INFO
