# Конфигурация MCP для Codex. Тот же сервер, что и в .mcp.json: протокол MCP единый,
# различается только файл и способ чтения пароля.
# Секреты не коммитятся: значения берутся из переменных окружения.
#
# Сервер PostgreSQL принимает подключение URL аргументом командной строки, а не из переменных
# PGHOST/PGUSER/PGPASSWORD, поэтому URL собирается в оболочке из переменных, которые Codex
# пересылает по имени (env_vars). Подстановки ${VAR} в args Codex не делает — отсюда sh -c.

[mcp_servers.postgres]
command = "sh"
args = ["-c", "exec npx -y @modelcontextprotocol/server-postgres \"postgresql://$PGUSER:$PGPASSWORD@$PGHOST:$PGPORT/$PGDATABASE\""]
env_vars = ["PGHOST", "PGPORT", "PGDATABASE", "PGUSER", "PGPASSWORD"]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
